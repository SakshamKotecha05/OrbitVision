<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OrbitVision - Conjunction Risk Console</title>
    <link rel="icon" href="data:," />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <div class="brand">
          <svg class="brand-glyph" viewBox="0 0 26 14" width="26" height="14" aria-hidden="true">
            <line x1="3" y1="11" x2="23" y2="3" class="brand-glyph-line" />
            <circle cx="3" cy="11" r="2.75" class="brand-glyph-primary" />
            <circle cx="23" cy="3" r="2.75" class="brand-glyph-secondary" />
          </svg>
          <div class="brand-text">
            <span class="brand-name">Orbit<b>Vision</b></span>
            <span class="brand-sub">Conjunction Risk Bulletin</span>
          </div>
        </div>

        <nav class="mode-switch" role="tablist" aria-label="View mode">
          <button
            type="button"
            id="mode-global"
            class="mode-btn is-active"
            role="tab"
            aria-selected="true"
          >
            Global Screen
          </button>
          <span class="mode-divider" aria-hidden="true"></span>
          <button type="button" id="mode-india" class="mode-btn" role="tab" aria-selected="false">
            India Watch
          </button>
        </nav>

        <div class="topbar-meta">
          <div class="meta-item">
            <span class="meta-label">Window</span>
            <span class="meta-value" id="meta-window">-</span>
          </div>
          <div class="meta-item">
            <span class="meta-label">Screened</span>
            <span class="meta-value" id="meta-screened">-</span>
          </div>
          <button type="button" id="uncertainty-toggle" class="uncertainty-btn" aria-expanded="false">
            <span aria-hidden="true">i</span>
            <span class="sr-only">Uncertainty model notice</span>
          </button>
        </div>
      </header>

      <main class="globe-wrap">
        <div id="cesiumContainer"></div>

        <div id="uncertainty-note" class="unc-new" role="note" hidden></div>

        <div class="legend-new" aria-hidden="false">
          <div class="row1">
            <span class="title">Risk band by max Pc</span>
            <span class="threshold" id="legend-threshold"></span>
          </div>
          <div class="instrument">
            <div class="bar" id="legend-ruler-bar"></div>
            <div id="legend-ruler-ticks"></div>
          </div>
          <div class="band-labels">
            <span class="chip low"><i></i>Low</span>
            <span class="chip mod"><i></i>Mod</span>
            <span class="chip high"><i></i>High</span>
            <span class="chip crit"><i></i>Crit</span>
          </div>
        </div>

        <div class="india-new" id="india-banner" hidden>
          <div class="t">India Watch</div>
          <div class="copy" id="india-banner-copy"></div>
        </div>
      </main>

      <aside class="panel" aria-label="Conjunction risk list and detail">
        <div class="panel-list" id="panel-list">
          <div class="panel-list-head">
            <h2 id="panel-heading">Ranked risks</h2>
            <span class="panel-count" id="panel-count"></span>
          </div>
          <ol class="cardR-list" id="risk-rows" tabindex="-1"></ol>
        </div>

        <div class="panel-detail" id="panel-detail" hidden>
          <button type="button" class="back-btn" id="detail-back">&larr; Back to risk list</button>
          <div id="detail-body"></div>
        </div>
      </aside>

      <footer class="scrub-new">
        <div class="scrub-top">
          <div class="scrub-controls">
            <button type="button" id="play-toggle" class="play" aria-label="Play time scrub">
              <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true" id="play-icon">
                <path d="M8 5v14l11-7z" fill="currentColor" />
              </svg>
            </button>

            <div class="clockblock">
              <div class="clock">
                <span class="date" id="scrub-date">-</span>
                <span class="time" id="scrub-time">-</span>
                <span class="tz">UTC</span>
              </div>
              <div class="rel" id="scrub-rel"></div>
            </div>

            <div class="scrub-speed">
              <label for="speed-select" class="sr-only">Playback speed</label>
              <select id="speed-select">
                <option value="60">1 min/s</option>
                <option value="300" selected>5 min/s</option>
                <option value="900">15 min/s</option>
                <option value="3600">1 hr/s</option>
              </select>
            </div>
          </div>

          <div class="scrub-window">
            <span id="scrub-window-hours">-</span>
            <span id="scrub-window-span">-</span>
          </div>
        </div>

        <div class="scrub-ruler">
          <div class="ruler-labels" id="ruler-labels"></div>
          <div class="track" id="scrub-track">
            <div class="gridlines" id="scrub-gridlines"></div>
            <div class="density" id="scrub-ticks" aria-hidden="true"></div>
            <div class="needle" id="scrub-needle"></div>
            <input
              type="range"
              id="scrub-slider"
              class="scrub-slider"
              min="0"
              max="1000"
              value="0"
              step="1"
              aria-label="Scrub prediction window"
            />
          </div>
        </div>
      </footer>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
